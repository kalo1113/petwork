spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver  # MySQL 8.x驱动
    url: jdbc:mysql://localhost:3306/petwork?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: lxt1113

  # Redis 配置（修正层级：spring.redis 而非 spring.data.redis）
  redis:  # 关键修正：从spring.data.redis改为spring.redis
    host: localhost
    port: 6379
    timeout: 30000
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 2
        max-wait: 10000

  # 文件上传大小限制
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

  # 全局日期格式化（配合WebMvcConfig）
  mvc:
    format:
      date: yyyy-MM-dd  # 统一日期格式

# ========== 上传路径配置（整合用户头像 + 宠物图片） ==========
upload:
  # 用户头像路径（原有）
  user-avatar-path: F:/毕设/新建文件夹/pet-backend/user-img/
  avatar-access-path: /avatar/
  # 宠物图片路径（新增）
  pet-photo-path: F:/毕设/新建文件夹/pet-backend/pet-photo/
  pet-photo-access-path: /pet-images/

# MyBatis-Plus 完整配置
mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: org.example.petbackend.entity
  configuration:
    map-underscore-to-camel-case: true  # 下划线转驼峰（必须）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 打印SQL（开发用）
  global-config:
    db-config:
      id-type: auto  # 主键自增策略
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 服务器配置
server:
  port: 8080
  servlet:
    encoding:
      force-response: true  # 强制UTF-8编码（解决中文乱码）
  # 静态资源缓存（可选，提升图片访问速度）
  web:
    resources:
      cache:
        period: 3600  # 缓存1小时

# 日志配置（调试用）
logging:
  level:
    org.example.petbackend: debug
    org.springframework.web.multipart: debug
    com.baomidou.mybatisplus: debug  # MyBatis-Plus日志（可选）
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"  # 日志格式
