spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/petwork?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: lxt1113

  redis:
    host: localhost
    port: 6379
    timeout: 30000
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 2
        max-wait: 10000

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

  mvc:
    format:
      date: yyyy-MM-dd

  # 静态资源映射：保留默认classpath:/static/即可
  web:
    resources:
      static-locations: classpath:/static/
      cache:
        period: 3600

# ========== 上传路径配置（匹配数据库路径） ==========
upload:
  # 用户头像（保持原有）
  user-avatar-path: classpath:/static/images/user-img/
  avatar-access-path: /user-img/

  # 宠物图片（保持原有）
  pet-photo-path: classpath:/static/images/pet-img/
  pet-photo-access-path: /pet-img/

  # 产品图片（保持原有）
  product-img-path: classpath:/static/images/product-img/
  product-img-access-path: /product-img/

  # 保险图片：access-path改为数据库里的/insurance-img/
  insurance-img-path: classpath:/static/images/insurance-img/
  insurance-img-access-path: /insurance-img/

  # 理赔图片：access-path改为数据库里的/claim-img/
  claim-img-path: classpath:/static/images/claim-img/
  claim-img-access-path: /claim-img/

# MyBatis-Plus 配置（保持不变）
mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: org.example.petbackend.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 服务器配置（保持不变）
server:
  port: 8080
  servlet:
    encoding:
      force-response: true

# 日志配置（保持不变）
logging:
  level:
    org.example.petbackend: debug
    org.springframework.web.multipart: debug
    com.baomidou.mybatisplus: debug
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"
